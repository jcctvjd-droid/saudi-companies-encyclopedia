version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: saudi-companies-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saudi_companies}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saudi_companies}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saudi-companies

  redis:
    image: redis:7-alpine
    container_name: saudi-companies-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saudi-companies

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: saudi-companies-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saudi-companies

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saudi-companies-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - saudi-companies

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saudi-companies-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - saudi-companies

volumes:
  postgres_data:
  opensearch_data:

networks:
  saudi-companies:
    driver: bridge
